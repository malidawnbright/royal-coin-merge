<script>
(() => {
'use strict';
// Everything, including typography, coins, particles and sound, is generated locally.
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=420,H=820,STEP=85,GX=40,GY=266;
const palette=[['#ff8190','#ed2850','#861332'],['#91f6a7','#1bc761','#086435'],['#c69aff','#9147f5','#48207d'],['#79e3ff','#159edc','#095579'],['#fff09d','#f6c129','#926011']];
let scale=1,ox=0,oy=0,dpr=1,clock=0,last=0,board=[],tray=[],selected=null,moveMode=false,moves=3,level=1,score=0,total=0,target=600,shownScore=0,busy=false,over=false,tutorial=0,turn=0,muted=false;
let flights=[],particles=[],labels=[],rings=[],jobs=[],shake=0,flash=0,levelBanner=0;
let pending=[],resolving=false,landing=0;
let victoryCoins=[];
let impactPause=0,lastImpactPause=-10;
let scoreMotes=[],finishAccent=null;
let debugOpen=false,debugTaps=[];
const debugPanel=document.getElementById('debugPanel'),debugLevelInput=document.getElementById('debugLevel'),debugError=document.getElementById('debugError');
function closeDebug(){debugOpen=false;debugPanel.hidden=true;debugTaps=[];last=0;canvas.focus();}
function openDebug(){debugOpen=true;debugPanel.hidden=false;debugLevelInput.value=String(level);debugError.textContent='';debugTaps=[];for(const voice of coinVoices){voice.stop();voice.disconnect();}coinVoices.clear();debugLevelInput.focus();}
function debugCornerTap(x,y){
 if(x<0||x>80||y<0||y>85){debugTaps=[];return false;}
 const now=performance.now();debugTaps=debugTaps.filter(t=>now-t<=1500);debugTaps.push(now);if(debugTaps.length>=5)openDebug();return true;
}
function jumpDebugLevel(value){
 const chosen=Number(value);if(!Number.isInteger(chosen)||chosen<1||chosen>9999){debugError.textContent='1–9999 arasında bir bölüm numarası gir.';return false;}
 level=chosen;score=0;total=0;tutorial=chosen===1?0:2;restart();dropPreviewCache=null;shake=0;flash=0;closeDebug();return true;
}
function testJoker(){level=10;score=0;total=0;tutorial=2;restart();tray[0]=trayArrival(makeJoker());board[5]=makeStack([2,2,4,4,4]);board[4]=makeStack([2,2,2,2]);closeDebug();}
document.getElementById('debugJoker').addEventListener('click',testJoker);
function submitDebug(e){e.preventDefault();jumpDebugLevel(debugLevelInput.value);}
document.getElementById('debugForm').addEventListener('submit',submitDebug);
document.getElementById('debugClose').addEventListener('click',closeDebug);
for(const n of [3,4,6,5,10])document.getElementById('debugQuick'+n).addEventListener('click',()=>jumpDebugLevel(n));
debugPanel.addEventListener('click',e=>{if(e.target===debugPanel)closeDebug();});
document.addEventListener('keydown',e=>{if(debugOpen&&e.key==='Escape'){e.preventDefault();closeDebug();}});

let jokerTutorial=false;
let jokerCountdown=8+Math.floor(Math.random()*5),jokerFX=null;
let frozenCoins=Array(16).fill(null);
let cellLocks=Array(16).fill(0),lockHitsAt=Array(16).fill(-10),lockBursts=[],lockPulses=[],woodBursts=[],cellCoverTypes=Array(16).fill(null);
// Authored onboarding, followed by six-level difficulty waves.
const INTRO_LEVELS=[
 {target:600,wood:[],locks:[]},
 {target:700,wood:[],locks:[]},
 {target:800,wood:[],locks:[5]},
 {target:850,wood:[0,1,2,3],locks:[]},
 {target:1000,wood:[],locks:[],ice:[6],introIce:true},
 {target:1050,wood:[],locks:[9]},
 {target:1100,wood:[0,3,12,15],locks:[]},
 {target:1250,wood:[],locks:[5,10]},
 {target:1200,wood:[0,1,2],locks:[],ice:[10]},
 {target:1000,wood:[],locks:[],chainBoard:true},
 {target:1400,wood:[0,3,12,15],locks:[6]},
 {target:1500,wood:[0,1,2,3],locks:[9,10]}
];
function levelConfig(n){
 if(n<=INTRO_LEVELS.length)return {...INTRO_LEVELS[n-1],moves:3};
 const phase=(n-13)%6,cycle=Math.floor((n-13)/6);
 const patterns=[
  {wood:[],locks:[],offset:0},
  {wood:[0,1,2,3],locks:[],offset:150},
  {wood:[],locks:[5],ice:[10],offset:250},
  {wood:[0,3,12,15],locks:[6],offset:200},
  {wood:[],locks:[5,6,10],offset:350},
  {wood:[0,1,2,3],locks:[9,10],offset:400}
 ];
 const p=patterns[phase];
 // Rotate layouts each cycle without increasing blocked space indefinitely.
 const rotate=i=>{for(let r=0;r<cycle%4;r++)i=(i%4)*4+3-Math.floor(i/4);return i;};
 return {target:Math.min(2400,1300+cycle*100)+p.offset,moves:3,wood:p.wood.map(rotate),locks:p.locks.map(rotate),ice:(p.ice||[]).map(rotate),chainBoard:phase===0};
}
function setupLocks(){
 lockHitsAt=Array(16).fill(-10);lockBursts=[];lockPulses=[];woodBursts=[];cellLocks=Array(16).fill(0);cellCoverTypes=Array(16).fill(null);
 const config=levelConfig(level);frozenCoins=Array(16).fill(null);
 for(const i of config.ice||[]){cellLocks[i]=2;cellCoverTypes[i]='ice';frozenCoins[i]=[4,4,4,4];}
 for(const i of config.wood){cellLocks[i]=1;cellCoverTypes[i]='wood';}
 for(const i of config.locks){cellLocks[i]=3;cellCoverTypes[i]='lock';}
}
function reduceLocks(locks,cell){const changed=[];for(const i of adjacent(cell))if(locks[i]>0){locks[i]--;changed.push(i);}return changed;}
function hitAdjacentLocks(cell,color=4,chain=null){
 for(const i of reduceLocks(cellLocks,cell)){
  lockHitsAt[i]=clock;lockPulses.push({from:cell,to:i,at:clock,color,unlocked:cellLocks[i]===0});if(lockPulses.length>24)lockPulses.shift();const p=pos(i);rings.push({x:p.x,y:p.y,age:0,c:'#ffe39e'});
  if(!cellLocks[i]){if(cellCoverTypes[i]==='ice'){board[i]=makeStack(frozenCoins[i]);board[i].hit=clock;frozenCoins[i]=null;enqueue(i,chain||{pitch:0,pops:0,waves:0});sound('unlock');burst(p.x,p.y,3,35);}else if(cellCoverTypes[i]==='wood'){sound('wood');woodBursts.push({i,from:cell,at:clock});}else{sound('unlock');lockBursts.push({i,at:clock});}label('AÇILDI!',p.x,p.y-14,'#ffe7a1',20);shake=Math.max(shake,4);}
  else{sound('lockhit');label(cellLocks[i]+' KALDI',p.x,p.y-14,'#ffe7a1',16);}
 }
}
function drawIceCover(i,remaining,ghost=false){
 const p=pos(i),coins=frozenCoins[i]||[4,4,4,4],age=clock-lockHitsAt[i],impact=ghost?0:Math.max(0,1-age/.3);
 ctx.save();ctx.translate(p.x+Math.sin(age*70)*impact*3,p.y);stack(0,0,{coins,visible:coins.length});
 box(-37,-44,74,77,16,'#75dfff66','#c8f7ff');box(-32,-39,64,67,12,null,'#efffff77');
 ctx.strokeStyle='#efffff';ctx.lineWidth=remaining===1?2.5:1.2;ctx.beginPath();ctx.moveTo(-25,-29);ctx.lineTo(-5,-9);ctx.lineTo(-13,2);ctx.lineTo(12,21);if(remaining===1){ctx.moveTo(-5,-9);ctx.lineTo(15,-18);ctx.lineTo(27,-9);ctx.moveTo(-13,2);ctx.lineTo(-26,16);}ctx.stroke();
 ellipse(26,-33,10,10,'#d5fbff');text(String(remaining),26,-33,11,'#24516b',900);ctx.restore();
}
function drawWoodCover(i,ghost=false){
 const p=pos(i),left=-38,top=-43,size=76,radius=18;
 ctx.save();ctx.globalAlpha=ghost?.85:1;ctx.translate(p.x,p.y);
 // Exactly the playable cell outline: continuous wood, clipped at its rounded edges.
 ctx.beginPath();ctx.roundRect(left,top,size,size,radius);ctx.clip();
 const body=ctx.createLinearGradient(-30,top,28,top+size);body.addColorStop(0,'#ffe0a0');body.addColorStop(.48,'#dda15a');body.addColorStop(1,'#ac672f');
 ctx.fillStyle=body;ctx.fillRect(left,top,size,size);
 for(let row=0;row<3;row++){
  const y=top+row*size/3,h=size/3,g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,row===1?'#f3c57f':'#ffda96');g.addColorStop(.16,'#eab56d');g.addColorStop(.7,row===1?'#d29851':'#dca15a');g.addColorStop(1,'#bc7b3c');
  ctx.fillStyle=g;ctx.fillRect(left,y,size,h+.3);
  // Broad, softly curved grain stays inside the cover; seams have no open gaps.
  for(let line=0;line<3;line++){
   const gy=y+7+line*5,offset=Math.sin(i*.8+row*2+line)*2;
   ctx.beginPath();ctx.moveTo(-42,gy);ctx.bezierCurveTo(-19,gy-3+offset,8,gy+4,42,gy-1);ctx.strokeStyle=line===1?'#8c52252d':'#fff0bd38';ctx.lineWidth=line===1?1.2:.9;ctx.stroke();
  }
  if(row>0){ctx.fillStyle='#875126';ctx.fillRect(left,y-.4,size,1.1);ctx.fillStyle='#ffe4a987';ctx.fillRect(left,y+.8,size,1);}
 }
 // A small wood knot instead of busy repeated grain marks.
 ctx.save();ctx.translate(15,-5);ctx.scale(1,.52);ctx.strokeStyle='#9a5d2c50';ctx.lineWidth=1.1;ctx.beginPath();ctx.ellipse(0,0,6,3.6,0,0,Math.PI*2);ctx.stroke();ellipse(0,0,2.1,1.2,'#a76a3545');ctx.restore();
 // Inset bevel makes the single cap feel thick without leaving a dark outer margin.
 ctx.beginPath();ctx.roundRect(left+1,top+1,size-2,size-2,radius-1);ctx.strokeStyle='#835029';ctx.lineWidth=2;ctx.stroke();
 const rim=ctx.createLinearGradient(0,top,0,top+size);rim.addColorStop(0,'#fff0bcd9');rim.addColorStop(.35,'#ffe2a66b');rim.addColorStop(1,'#8a502b88');ctx.beginPath();ctx.roundRect(left+2.5,top+2.5,size-5,size-5,radius-2.5);ctx.strokeStyle=rim;ctx.lineWidth=2;ctx.stroke();
 for(const x of [-26,26])for(const y of [-31,21]){
  ellipse(x,y+.7,3,3,'#86532c66');const nail=ctx.createLinearGradient(x-2,y-2,x+2,y+2);nail.addColorStop(0,'#fff0c7');nail.addColorStop(.45,'#d9b87d');nail.addColorStop(1,'#977045');ellipse(x,y,2.25,2.25,nail);ellipse(x-.6,y-.7,.7,.7,'#fff7df');
 }
 ctx.restore();
}

function drawWoodBursts(){
 woodBursts=woodBursts.filter(b=>clock-b.at<.55);
 for(const b of woodBursts){const t=clock-b.at,p=pos(b.i),source=pos(b.from),dx=(p.x-source.x)/STEP,dy=(p.y-source.y)/STEP,fade=1-t/.55;ctx.save();ctx.globalAlpha=fade;
  for(let k=0;k<10;k++){const angle=k*Math.PI*2/10+.3,speed=55+(k%3)*23;ctx.save();ctx.translate(p.x+Math.cos(angle)*t*speed+dx*115*t,p.y-9+Math.sin(angle)*t*speed+dy*115*t-32*t+110*t*t);ctx.rotate(angle+t*(k%2?7:-6));box(-7,-3,k%2?16:11,6,2,k%2?'#e5b370':'#b77c42');ctx.restore();}
  ctx.globalAlpha=fade*.26;ellipse(p.x,p.y,16+t*65,12+t*45,'#f4d6a0');ctx.restore();
 }
}
function drawChainLink(x,y,angle=0,edge=false,broken=false){
 ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.lineCap='round';
 const w=edge?5:12,h=8;
 function outline(dx,dy,width,color){ctx.beginPath();ctx.roundRect(-w/2+dx,-h/2+dy,w,h,Math.min(w/2,4));ctx.lineWidth=width;ctx.strokeStyle=color;ctx.stroke();}
 outline(0,1.6,4.8,'#080f1dbb');
 const steel=ctx.createLinearGradient(0,-5,0,5);steel.addColorStop(0,'#eff8ff');steel.addColorStop(.3,'#aec7d7');steel.addColorStop(.6,'#5c7c92');steel.addColorStop(1,'#b0c8d4');
 outline(0,0,3.3,steel);ctx.beginPath();ctx.moveTo(-w/2+2,-h/2+.5);ctx.lineTo(w/2-2,-h/2+.5);ctx.strokeStyle='#ffffffbd';ctx.lineWidth=.8;ctx.stroke();
 if(broken){ctx.beginPath();ctx.moveTo(w/2-2,-4);ctx.lineTo(w/2+2,0);ctx.strokeStyle='#152334';ctx.lineWidth=2.4;ctx.stroke();}
 ctx.restore();
}
function drawCellLock(i,remaining,ghost=false){
 const p=pos(i),age=Math.max(0,clock-lockHitsAt[i]),impact=ghost?0:Math.max(0,1-age/.3),damage=3-remaining;
 ctx.save();ctx.globalAlpha=ghost?.85:1;ctx.translate(p.x,p.y);ctx.translate(Math.sin(age*100)*(3+damage*1.5)*impact,-Math.sin(Math.min(1,age/.3)*Math.PI)*2*impact);ctx.rotate(Math.sin(age*75)*(.045+damage*.025)*impact);
 const tile=ctx.createLinearGradient(-30,-43,30,33);tile.addColorStop(0,'#35465a');tile.addColorStop(.5,'#223348');tile.addColorStop(1,'#142335');
 box(-38,-42,76,76,17,'#0a1324');box(-38,-44,76,74,17,tile,'#748797');box(-34,-40,68,66,13,null,'#b5cddd20');
 // Recessed socket, understated corner fasteners, and one draped chain (no X).
 ellipse(0,4,25,20,'#09142366');
 for(const x of [-29,29]){ellipse(x,-11,5.5,5.5,'#0d1b2b');ellipse(x,-12,4.1,4.1,'#738fa1');ellipse(x-1,-13,1.4,1.4,'#dcecf4');}
 for(let k=0;k<9;k++){const x=-28+k*7,y=-12+(5+damage*3)*Math.sin(k/8*Math.PI)+(damage>=2&&k===6?2:0);drawChainLink(x,y,Math.cos(k/8*Math.PI)*.19,k%2===1,damage>=2&&k===6);}
 ctx.save();ctx.translate(0,1);ctx.rotate(-damage*.055+(ghost?0:Math.sin(age*28)*.10*damage*Math.exp(-age*5))); 
 // Thick curved steel shackle, nested highlights, then a beveled gold body.
 function shackle(width,color,dx=0,dy=0){ctx.beginPath();ctx.moveTo(-9+dx,-3+dy);ctx.lineTo(-9+dx,-15+dy);ctx.bezierCurveTo(-9+dx,-28+dy,9+dx,-28+dy,9+dx,-15+dy);ctx.lineTo(9+dx,-3+dy);ctx.lineWidth=width;ctx.strokeStyle=color;ctx.lineCap='round';ctx.stroke();}
 shackle(8,'#0b1525',0,2);const metal=ctx.createLinearGradient(-12,-20,12,-10);metal.addColorStop(0,'#69879c');metal.addColorStop(.4,'#f0f8ff');metal.addColorStop(.7,'#9fbacb');metal.addColorStop(1,'#4d6a80');shackle(5.5,metal);shackle(1,'#ffffffaa',-.7,-.7);
 box(-17,-6,34,30,8,'#09111c77');box(-17,-8,34,30,8,'#87602a');
 const gold=ctx.createLinearGradient(-15,-9,15,19);gold.addColorStop(0,impact>.3?'#fff9df':'#fff0b8');gold.addColorStop(.35,'#edce80');gold.addColorStop(.75,'#c29442');gold.addColorStop(1,'#f3d68c');
 box(-17,-9,34,29,8,gold,'#ffeabb');box(-13,-5,26,21,5,null,'#fff4c85c');
 // Keyhole keeps this readable as a padlock at phone size.
 ellipse(0,3,3.8,3.8,'#715024');ellipse(0,2.2,3.2,3.2,'#263446');box(-1.6,3,3.2,6,1,'#263446');
 function crack(points){for(const [color,width,shift] of [['#fff1ba',2.2,.8],['#77512c',1.3,0]]){ctx.beginPath();ctx.moveTo(points[0][0]+shift,points[0][1]);for(const v of points.slice(1))ctx.lineTo(v[0]+shift,v[1]);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}}
 if(damage)crack([[-12,-8],[-8,-3],[-11,1],[-7,7],[-9,15]]);
 if(damage>=2)crack([[15,-1],[10,3],[12,8],[7,12],[10,19]]);
 ctx.restore();
 // Small remaining-hit badge; no instructional text on the tile.
 ellipse(26,-32,10,10,'#102033');ellipse(26,-33,9,9,'#e9d59f');text(String(remaining),26,-33,11,'#334457',900);
 if(impact>0){ctx.globalAlpha=impact;for(let k=0;k<5;k++){const angle=k*2.4+i,distance=14+age*100;ellipse(Math.cos(angle)*distance,-5+Math.sin(angle)*distance,1.6,1.6,'#ffeab0');}}
 ctx.restore();
}
function drawLockPulses(){
 lockPulses=lockPulses.filter(p=>clock-p.at<.55);
 for(const pulse of lockPulses){const age=clock-pulse.at,a=pos(pulse.from),b=pos(pulse.to),t=clamp(age/.13,0,1),color=palette[pulse.color][0];
 ctx.save();ctx.lineCap='round';
 // A short luminous trail identifies the matching stack that damaged this lock.
 if(age<.23){const fade=1-clamp((age-.13)/.1,0,1),endX=a.x+(b.x-a.x)*t,endY=a.y+(b.y-a.y)*t;ctx.globalAlpha=fade;
 for(const [width,ink] of [[10,color+'25'],[4,color],[1.5,'#fff8dc']]){ctx.strokeStyle=ink;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(endX,endY);ctx.stroke();}
 ellipse(endX,endY,4,4,'#fff4ce');}
 if(age>=.10){const u=clamp((age-.10)/.45,0,1),fade=1-u;ctx.globalAlpha=fade;
 ctx.strokeStyle=pulse.unlocked?'#fff3c4':color;ctx.lineWidth=2.5*fade;ctx.beginPath();ctx.ellipse(b.x,b.y,13+u*29,10+u*24,0,0,Math.PI*2);ctx.stroke();
 for(let k=0;k<8;k++){const angle=k*Math.PI/4+.2,r=12+u*36,x=b.x+Math.cos(angle)*r,y=b.y+Math.sin(angle)*r;ctx.strokeStyle=k%2?color:'#fff3c4';ctx.lineWidth=2*fade;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(angle)*6*fade,y+Math.sin(angle)*6*fade);ctx.stroke();}
 if(u<.35){ctx.globalAlpha=(1-u/.35)*.32;box(b.x-34,b.y-40,68,68,14,'#ffe8ab');}}
 ctx.restore();
 }
}

function drawLockBursts(){
 lockBursts=lockBursts.filter(b=>clock-b.at<.65);
 for(const b of lockBursts){const t=clock-b.at,p=pos(b.i),fade=Math.max(0,1-t/.65);ctx.save();
  ctx.globalAlpha=fade;ctx.strokeStyle='#ffe7a1';ctx.lineWidth=3*fade;ctx.beginPath();ctx.ellipse(p.x,p.y,15+t*95,12+t*75,0,0,Math.PI*2);ctx.stroke();
  for(let k=0;k<12;k++){const angle=k*Math.PI*2/12+.25,radius=12+t*(65+(k%3)*26),x=p.x+Math.cos(angle)*radius,y=p.y-8+Math.sin(angle)*radius-55*t+110*t*t;ctx.save();ctx.translate(x,y);ctx.rotate(angle+t*(k%2?8:-8));if(k%3===0)drawChainLink(0,0,0,false,true);else box(-4,-3,7,6,2,k%2?'#f4d58d':'#9d8050');ctx.restore();}
  if(t<.12){ctx.globalAlpha=(1-t/.12)*.45;ellipse(p.x,p.y,27+t*120,22+t*90,'#fff1be');}ctx.restore();
 }
}
const EXTRA_SLOT_UNLOCK_LEVEL=6;
let extraSlotActive=false;
const POWER_BUTTONS={move:{x:140,y:766,r:27},extra:{x:280,y:766,r:27}};
function powerHit(button,x,y){return Math.hypot(x-button.x,y-button.y)<=button.r;}
function trayArrival(s,delay=0){s.arriveAt=clock+delay;return s;}
function arrivalPose(s){const t=clamp((clock-(s.arriveAt??-10))/.32,0,1),u=ease(t);return {y:22*(1-u),scale:.78+.22*u+.08*Math.sin(Math.PI*t),alpha:.25+.75*u};}
function trayCount(){return extraSlotActive?4:3;}
function trayPos(i){return {x:extraSlotActive?75+i*90:95+i*115,y:tray[i]?.joker?676.5:690};}
function trayAt(x,y){if(y<=621||y>=735)return -1;for(let i=0;i<tray.length;i++)if(Math.abs(x-trayPos(i).x)<(extraSlotActive?40:48))return i;return -1;}
function activateExtraSlot(){

function coinRecordings(){if(!recordedCoinSamples)recordedCoinSamples=RECORDED_COIN_PCM.map(encoded=>{const raw=atob(encoded),out=new Float32Array(raw.length/2);for(let i=0;i<out.length;i++){let v=raw.charCodeAt(i*2)|(raw.charCodeAt(i*2+1)<<8);out[i]=(v>=32768?v-65536:v)/32768;}return out;});return recordedCoinSamples;}
function synthCoinCue(kind,variant,sampleRate){
 if(kind==='wood'){const out=new Float32Array(Math.ceil(sampleRate*.18));let low=0;for(let i=0;i<out.length;i++){const t=i/sampleRate;low+=.18*((audioRandom()*2-1)-low);out[i]=(.42*low*Math.exp(-t/.032)+.15*Math.sin(2*Math.PI*180*t)*Math.exp(-t/.024))*Math.min(1,i/35,(out.length-1-i)/150);}return out;}

 const clips=coinRecordings(),events=[];const add=(index,at,gain=1,speed=1)=>events.push({index,at,gain,speed});
 // Tiny rate variation preserves the sound of real coins, without musical ringing.
 const variation=.98+(variant%6)*.009;
 if(kind==='click')add(1,0,.5,1.04);
 else if(kind==='coin')add(variant%4,0,.88,variation);
 else if(kind==='drop'){add(0,0,.9);add(1,.038,.28);}
 else if(kind==='scatter'){
  // One recorded-coin scatter per disappearing diagonal wave.
  const strength=.78+Math.min(variant,2)*.12;
  add(3,0,strength,1.02);add(0,.025,.66*strength,1.04);add(2,.072,.54*strength,.99);add(1,.125,.36*strength,1.08);
 }
 else if(kind==='refill'){
add(1,0,.42);add(0,.07,.35);add(2,.15,.26);}
 else if(kind==='match'){add(0,0,1.1);add(2,.035,.6);}
 else if(kind==='pop'){add(3,0,1.25);add(0,.025,.6);add(4,.055,.85);add(2,.12,.45);}
 else if(kind==='power'||kind==='unlock'){add(0,0,.72);add(2,.08,.6);add(3,.17,.55);}
 else if(kind==='lockhit')add(1,0,.85,.94);
 else if(kind==='win'){add(3,0,1.1);add(4,.03,.95);add(0,.16,.65);add(2,.32,.6);add(3,.53,.7);}
 else if(kind==='fail')add(1,0,.45,.92);
 else add(0,0,.7);
 const duration=Math.max(kind==='win'?1.32:0,...events.map(e=>e.at+clips[e.index].length/44100/e.speed)),out=new Float32Array(Math.ceil(duration*sampleRate));
 for(const e of events){const clip=clips[e.index],offset=Math.round(e.at*sampleRate),step=44100*e.speed/sampleRate;for(let i=0;i+offset<out.length;i++){const f=i*step,j=Math.floor(f);if(j>=clip.length-1)break;out[i+offset]+=(clip[j]+(clip[j+1]-clip[j])*(f-j))*e.gain;}}
 // Warm, harmonic reward accents (no inharmonic metallic oscillator modes).
 function rewardNote(at,f,gain,decay){const offset=Math.floor(at*sampleRate);for(let i=0;i+offset<out.length;i++){const t=i/sampleRate,env=(1-Math.exp(-t*700))*Math.exp(-t/decay),phase=2*Math.PI*f*t;out[i+offset]+=gain*env*(Math.sin(phase)+.20*Math.sin(phase*2)*Math.exp(-t/.06)+.06*Math.sin(phase*3)*Math.exp(-t/.035));}}

 if(kind==='match'){impactBody(.20);rewardNote(.015,659.25,.14,.09);rewardNote(.075,783.99,.12,.10);}
 if(kind==='pop'){const lift=Math.pow(2,Math.min(variant,3)/12);impactBody(.34);rewardNote(.01,523.25*lift,.19,.13);rewardNote(.06,659.25*lift,.16,.14);rewardNote(.115,783.99*lift,.15,.16);}
 if(kind==='win'){impactBody(.30);[523.25,659.25,783.99,1046.5].forEach((f,i)=>rewardNote(.02+i*.105,f,.20,.15));[523.25,659.25,783.99,1046.5].forEach((f,i)=>rewardNote(.54,f,i===3?.14:.11,.19));rewardNote(.79,1567.98,.055,.13);}
 if(kind==='match'||kind==='pop'||kind==='win'||kind==='scatter')for(let i=0;i<out.length;i++){out[i]=.86*Math.tanh(out[i]/.86);out[i]*=Math.min(1,(out.length-1-i)/(.02*sampleRate));}

}
function sound(kind,pitch=0){
 if(!audio||muted||audio.state!=='running')return;
 const now=audio.currentTime;
 if(kind==='coin'){if(now-lastCoinAudio<.025)return;lastCoinAudio=now;}
 if(kind==='pop'){if(now-lastPopAudio<.055)return;lastPopAudio=now;}
 const variant=kind==='scatter'?Math.min(2,Math.max(0,pitch-1)):kind==='coin'?Math.min(5,Math.floor(Math.max(0,pitch)/3)):kind==='pop'?Math.min(3,Math.max(0,pitch-1)):kind==='click'?(audioVariant++%3):0;
 const key=kind+':'+variant;let buffer=coinAudioCache.get(key);
 if(!buffer){const data=synthCoinCue(kind,variant,audio.sampleRate);buffer=audio.createBuffer(1,data.length,audio.sampleRate);buffer.getChannelData(0).set(data);coinAudioCache.set(key,buffer);}
 if(coinVoices.size>=20){if(kind==='coin'||kind==='refill'||kind==='click')return;const oldest=coinVoices.values().next().value;oldest.stop();oldest.disconnect();coinVoices.delete(oldest);}
 const source=audio.createBufferSource();source.buffer=buffer;if(kind==='coin')source.playbackRate.value=Math.pow(2,Math.min(4,Math.max(0,pitch)*.22)/12);source.connect(master);coinVoices.add(source);source.onended=()=>{source.disconnect();coinVoices.delete(source);};source.start();
}
