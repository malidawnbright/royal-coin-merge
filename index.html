}
let gesture=null,drag=null,returning=null,progressPulse=0;
const makeStack=coins=>({coins:[...coins],locked:false,visible:coins.length});

let audio=null,master=null,noise=null;

addEventListener('resize',resize);resize();
function text(s,x,y,size=16,color='#fff',weight=700){ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y);}

function sound(kind,pitch=0){if(kind==='click'){tone(340,.065,.24,'sine',160);tone(1200,.025,.035);}if(kind==='coin'){let f=780*Math.pow(1.075,Math.min(pitch,20));tone(f,.18,.12,'sine',f*1.3);tone(f*2.4,.10,.045,'triangle');}if(kind==='pop'){tone(170,.36,.65,'sine',35);if(audio&&!muted){let s=audio.createBufferSource(),g=audio.createGain(),f=audio.createBiquadFilter();s.buffer=noise;f.type='lowpass';f.frequency.value=2100;s.connect(f);f.connect(g);g.connect(master);g.gain.setValueAtTime(.18,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.3);s.start();s.stop(audio.currentTime+.32);}}if(kind==='win'){[523,659,784,1047].forEach((f,i)=>later(i*.11,()=>tone(f,.4,.17)));}}

function freshStack(){let n=Math.floor(rand(2,5)),a=Math.floor(rand(0,5)),b=(a+Math.floor(rand(1,5)))%5,split=Math.floor(rand(1,n));return makeStack(Array.from({length:n},(_,i)=>i<split?a:b));}

function restart(){extraSlotActive=false;victoryCoins=[];gesture=null;drag=null;returning=null;progressPulse=0;jobs=[];flights=[];particles=[];labels=[];rings=[];pending=[];resolving=false;landing=0;total=Math.max(0,total-score);score=0;shownScore=0;target=600+(level-1)*250;moves=3;tutorial=level===1?tutorial:2;turn=0;busy=false;over=false;levelBanner=0;seed();}
function fly(from,to,coins,onLand,pitch=0){coins.forEach((c,j)=>{flights.push({from:{x:from.x,y:from.y-j*7},to:{x:to.x,y:to.y-j*7},c,age:-j*.035,duration:.26,bend:rand(-25,25),done:()=>{sound('coin',pitch+j);onLand(j);}});});}

function nextLevel(){

// Clear diagonally, keeping the board visible until the last stack explodes.
const remaining=board.map((s,i)=>({s,i,d:i%4+Math.floor(i/4)})).filter(v=>v.s);
const lastWave=remaining.length?Math.max(...remaining.map(v=>v.d)):0;
label('MUHTEŞEM!',210,235,'#fff2b3',34);tone(440,.25,.16,'sine',880);
for(let wave=0;wave<=lastWave;wave++){
const cells=remaining.filter(v=>v.d===wave);if(!cells.length)continue;
const delay=.22+wave*.12;
later(delay-.12,()=>cells.forEach(({s})=>s.hit=clock));
later(delay,()=>{
sound('coin',8+wave*2);tone(115+wave*10,.19,.20,'sine',40);

for(const {s,i} of cells){if(board[i]!==s)continue;const p=pos(i);board[i]=null;

s.coins.slice(-18).forEach((c,j)=>victoryCoins.push({x:p.x,y:p.y-j*7,c,vx:rand(-160,160),vy:rand(-320,-170),spin:rand(-5,5),rot:0,age:0,life:rand(.65,1.05)}));
}
});}
const reveal=.22+lastWave*.12+.65;
later(reveal,()=>{levelBanner=1;sound('win');sound('pop');shake=8;flash=.13;burst(90,340,4,85);burst(330,340,2,85);});
later(reveal+1.35,()=>{level++;extraSlotActive=false;score=0;shownScore=0;target=600+(level-1)*250;board=Array(16).fill(null);victoryCoins=[];tray=freshTray();selected=null;moveMode=false;levelBanner=0;busy=false;});
}
function place(i,releasePoint=null){let s=selected;if(!s||board[i]||busy||score>=target)return;let src=s.type==='tray'?tray[s.i]:board[s.i];if(!src||src.locked||(s.type==='board'&&!moves))return;selected=null;let from;if(s.type==='tray'){tray[s.i]=null;from=trayPos(s.i);if(tray.every(x=>!x))tray=freshTray();}else{board[s.i]=null;from=pos(s.i);moves--;moveMode=false;}

function tap(x,y){initAudio();if(x>351&&y<83){muted=!muted;if(master)master.gain.value=muted?0:.55;return;}if(over){if(x>90&&x<330&&y>450&&y<510)restart();return;}if(busy)return;if(tutorial<2){if(tutorial===0&&x>47&&x<143&&y>621&&y<735){selected={type:'tray',i:0};tutorial=1;sound('click');}else if(tutorial===1&&x>GX+STEP&&x<GX+STEP*2&&y>GY+STEP&&y<GY+STEP*2)place(5);return;}if(y>621&&y<735){let i=trayAt(x,y);if(i>=0&&tray[i]){selected={type:'tray',i};moveMode=false;sound('click');}return;}if(powerHit(POWER_BUTTONS.extra,x,y)){activateExtraSlot();return;}if(powerHit(POWER_BUTTONS.move,x,y)){if(moves){moveMode=!moveMode;selected=null;sound('click');}return;}let col=Math.floor((x-GX)/STEP),row=Math.floor((y-GY)/STEP);if(col>=0&&col<4&&row>=0&&row<4){let i=row*4+col;if(board[i]&&moveMode&&!board[i].locked){selected={type:'board',i};sound('click');}else if(!board[i])place(i);}}
function cellAt(x,y){let c=Math.floor((x-GX)/STEP),r=Math.floor((y-GY)/STEP);return c>=0&&c<4&&r>=0&&r<4?r*4+c:-1;}
function pointerPoint(e){return {x:(e.clientX-ox)/scale,y:(e.clientY-oy)/scale};}

// Dry-run of the FIFO merge rules. All stacks and locks belong to the copy.

let dropPreviewCache=null;

function drawDropPreview(preview){
